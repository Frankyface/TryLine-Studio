name: Refresh rugby data

# The browser cannot call ESPN directly (it answers 403 to browser
# User-Agents), so the data is fetched here and committed as static JSON.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC, after the weekend's rugby
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # mirror-crests downscales through headless Chromium, and it sits in the
      # MIDDLE of `npm run refresh`. Without a browser it exits non-zero and the
      # three derivations after it - form, season records and the win model -
      # never run, which is exactly what CLAUDE.md says must not happen. The
      # playwright package ships no postinstall, so nothing else installs this.
      - run: npx playwright install --with-deps chromium

      - run: npm run refresh
      - run: npx vitest run --coverage
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # assets too: mirror-crests writes crest PNGs there and repoints
          # data/ at them, so staging only data would commit references to
          # files that were never committed, and the site would fall back to
          # monograms for every newly-mirrored crest.
          git add data assets
          git diff --staged --quiet || git commit -m "chore: refresh rugby data"
          git push
