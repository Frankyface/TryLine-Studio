name: Refresh rugby data

# The browser cannot call ESPN directly (it answers 403 to browser
# User-Agents), so the data is fetched here and committed as static JSON.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC, after the weekend's rugby
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run refresh
      - run: npx vitest run
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: refresh rugby data"
          git push
