name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The data refresh commits with GITHUB_TOKEN, and GitHub deliberately does not
  # let such a push trigger another workflow. Without this, refreshed data would
  # be committed but never deployed.
  workflow_run:
    workflows: ["Refresh rugby data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only what the app needs. Uploading the whole checkout would put
      # CLAUDE.md, handoff.md, the dev harness and the test fixtures on the
      # public web.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src styles data assets _site/
          if [ -f favicon.svg ]; then cp favicon.svg _site/; fi
          if [ -f 404.html ]; then cp 404.html _site/; fi
          echo "published $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
