name: Verify studio

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify graphics, application and posting pipeline
        run: |
          node scripts/serve.mjs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4321/ > /dev/null
          npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-verification
          path: |
            dev/shots/
            dev/app-shots/
            dev/posts/verification/
            dev/posts/weekly-verification/
            server.log
          retention-days: 7
